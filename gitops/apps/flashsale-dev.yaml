apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flashsale-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Burhan-Hakim/flashsale-platform.git
    targetRevision: main
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
