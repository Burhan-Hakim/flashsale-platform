alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-slack
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: slack-notifications
        slack_configs:
          - send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
